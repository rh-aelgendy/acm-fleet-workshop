apiVersion: apps/v1
kind: Deployment
metadata:
  name: ownership-gap
  labels:
    demo.acm.example.com/id: aro-retail
  namespace: acm-demo-lab
spec:
  replicas: 0
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ownership-gap
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ownership-gap
        demo.acm.example.com/id: aro-retail
      annotations:
        demo.acm.example.com/code-sha256: 4eae966670918c65fa7fa24cd3b51dcbc52294a114c871b39d41f7d424a82d78
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ownership-gap
        image: registry.access.redhat.com/ubi9/python-312@sha256:d350329565030871c36d24c43533db869e892390fb47dc5c44512a32792dc623
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /app/server.py
        env:
        - name: MODE
          value: catalog
        - name: CLUSTER_NAME
          value: fixture
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: code
        configMap:
          name: retail-code
      - name: tmp
        emptyDir: {}
